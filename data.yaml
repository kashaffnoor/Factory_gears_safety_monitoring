# PPE Detection Dataset Configuration
# Hard Hat Workers Dataset - Converted from COCO to YOLO format

path: ../data  # dataset root dir
train: train/images  # train images (relative to 'path')
val: valid/images  # val images (relative to 'path')
test: test/images  # test images (relative to 'path')

# Class names
names:
  0: head
  1: helmet
  2: person

# Required classes for compliance checking
# Note: This dataset focuses on helmet detection (safety gear)
# For PPE compliance, we primarily detect helmets
required_classes: [1]  # helmet
